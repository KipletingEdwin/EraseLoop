
<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title class="ion-text-center">Users</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  @if ( users$ | async; as users ) {
  <ion-list lines="inset">
    @for (user of (users$ | async); track user.id) {
    <ion-item>
      <ion-icon name="person-circle-outline" slot="start" color="tertiary" size="large"></ion-icon>
      <ion-label>
        <h2>{{ user.name }}</h2>
        <p>{{ user.username }}</p>
        <p>{{ user.email }}</p>
        <p>Company: {{user.company.name}} </p>
        <p>Location: {{user.address.city}}, {{ user.address.street }} </p>
      </ion-label>
    </ion-item>
    }
  </ion-list>
  } @else {
    <div class="spinner-container">
      <ion-spinner name="cresent" color="primary"></ion-spinner>
      <p>Loading users...</p>
    </div>
  }





</ion-content>
