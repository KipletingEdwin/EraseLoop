
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center"> Test Page </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>

      <ion-col size="12" sizeMd="6" sizeLg="4">
        <ion-card>
            <ion-card-header class="ion-text-center" color="success" >
              <ion-card-title>Posts</ion-card-title>
              <ion-card-subtitle>Here is a list of posts from the API</ion-card-subtitle>
            </ion-card-header>

            <ion-card-content></ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-card-content class="ion-display-flex ion-justify-content-center">
              <ion-button fill="outline" [routerLink]="['/posts']">Posts</ion-button>
            </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeMd="6" sizeLg="4">
        <ion-card>
          <ion-card-header class="ion-text-center" color="warning">
            <ion-card-title class="ion-text-center">Users</ion-card-title>
            <ion-card-subtitle>Here is a a lists of users from the API</ion-card-subtitle>
          </ion-card-header>

            <ion-card-content></ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-card-content class="ion-text-center">
              <ion-button fill="outline" [routerLink]="['/users']">Users</ion-button>
            </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeMd="6" sizeLg="4">
        <ion-card>
          <ion-card-header class="ion-text-center" color="danger">
            <ion-card-title>Comments</ion-card-title>
            <ion-card-subtitle>This is a list of comments from the API</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content></ion-card-content>
          <ion-card-content></ion-card-content>
          <ion-card-content  class="ion-text-center">
            <ion-button fill="outline" [routerLink]="['/comments']" >Commets</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
